<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="CTKB_9txeXMrLSuYICR1B_pjmvU8wR2KuNNo4pZdVQM" />

  <!-- Primary Meta -->
  <title>Diff Compare — Side-by-Side Text Comparison Tool</title>
  <meta name="description" content="Free online text diff tool. Compare two texts side-by-side with highlighted additions, deletions, and changes. 100% client-side — no data stored." />
  <meta name="keywords" content="diff tool, text compare, text diff, side by side compare, code diff, online diff, compare text online, merge tool" />
  <meta name="author" content="bordia98" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical -->
  <link rel="canonical" href="https://bordia98.github.io/diff-text-compare/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bordia98.github.io/diff-text-compare/" />
  <meta property="og:title" content="Diff Compare — Side-by-Side Text Comparison Tool" />
  <meta property="og:description" content="Free online text diff tool. Compare two texts side-by-side with highlighted additions, deletions, and changes. 100% client-side." />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="Diff Compare" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Diff Compare — Side-by-Side Text Comparison Tool" />
  <meta name="twitter:description" content="Free, instant, client-side text diff tool with syntax highlighting." />

  <!-- PWA -->
  <meta name="theme-color" content="#7C3AED" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Diff Compare",
    "url": "https://bordia98.github.io/diff-text-compare/",
    "description": "Free online text diff tool. Compare two texts side-by-side with highlighted additions, deletions, and changes.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background blobs -->
  <div class="bg-blob bg-blob--1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--2" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--3" aria-hidden="true"></div>

  <header class="header">
    <div class="header__inner">
      <div class="logo">
        <span class="logo__icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="8" fill="url(#logoGrad)"/>
            <path d="M7 10l4 4-4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
            <path d="M21 10l-4 4 4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
            <line x1="14" y1="8" x2="14" y2="20" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7C3AED"/>
                <stop offset="1" stop-color="#2563EB"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="logo__text">Diff<span class="logo__accent">Compare</span></span>
      </div>
      <div class="header__badges">
        <button class="theme-toggle" id="btn-theme" title="Toggle light / dark theme" aria-label="Toggle theme">
          <svg class="theme-toggle__icon theme-toggle__moon" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M15.5 10.5A6.5 6.5 0 017 2a6.5 6.5 0 000 13 6.5 6.5 0 008.5-4.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          <svg class="theme-toggle__icon theme-toggle__sun" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.22 3.22l1.42 1.42M13.36 13.36l1.42 1.42M3.22 14.78l1.42-1.42M13.36 4.64l1.42-1.42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <span class="badge" id="status-badge">Ready</span>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- Toolbar -->
    <div class="toolbar" role="toolbar" aria-label="Diff tools">
      <div class="toolbar__left">
        <button class="btn btn--primary" id="btn-compare" title="Compare texts (Ctrl+Enter)">
          <svg class="btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h5M9 4h5M2 8h5M9 8h5M2 12h5M9 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Compare
        </button>
        <div class="separator" aria-hidden="true"></div>
        <label class="indent-control" for="diff-mode-select">
          <span class="indent-control__label">Mode</span>
          <select class="select" id="diff-mode-select" aria-label="Diff mode">
            <option value="line">Line-by-Line</option>
            <option value="word">Word-by-Word</option>
            <option value="char">Character</option>
          </select>
        </label>
        <div class="separator" aria-hidden="true"></div>
        <label class="toggle-label" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace" class="toggle-checkbox" />
          <span class="toggle-switch"></span>
          <span class="toggle-text">Ignore Whitespace</span>
        </label>
        <label class="toggle-label" for="ignore-case">
          <input type="checkbox" id="ignore-case" class="toggle-checkbox" />
          <span class="toggle-switch"></span>
          <span class="toggle-text">Ignore Case</span>
        </label>
      </div>
      <div class="toolbar__right">
        <button class="btn btn--ghost" id="btn-swap" title="Swap texts">
          <svg class="btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 5h8M9 2l3 3-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 11H4M7 8l-3 3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Swap
        </button>
        <button class="btn btn--ghost" id="btn-sample" title="Load sample diff">
          <svg class="btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Sample
        </button>
        <button class="btn btn--ghost" id="btn-clear" title="Clear all">
          <svg class="btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Clear
        </button>
      </div>
    </div>

    <!-- Input panels -->
    <div class="editor-grid">
      <!-- Original Panel -->
      <div class="panel" id="original-panel">
        <div class="panel__header">
          <span class="panel__title">
            <svg class="panel__title-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 2h10v10H2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.5"/>
              <path d="M4 5h6M4 7h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Original
          </span>
          <div class="panel__actions">
            <button class="icon-btn" id="btn-paste-original" title="Paste from clipboard" aria-label="Paste original text">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="4" y="2" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M4 4H3a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-upload-original" title="Upload file" aria-label="Upload original file">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 9V2M4 5l3-3 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 9v2a1 1 0 001 1h8a1 1 0 001-1V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="panel__body">
          <textarea
            class="editor"
            id="text-original"
            placeholder="Paste original text here…"
            spellcheck="false"
            autocomplete="off"
            aria-label="Original text"
          ></textarea>
        </div>
        <div class="panel__footer">
          <span class="meta" id="original-meta">0 lines · 0 chars</span>
        </div>
      </div>

      <!-- Divider -->
      <div class="editor-divider" aria-hidden="true">
        <div class="divider-line"></div>
      </div>

      <!-- Modified Panel -->
      <div class="panel" id="modified-panel">
        <div class="panel__header">
          <span class="panel__title">
            <svg class="panel__title-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 2h10v10H2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.5"/>
              <path d="M4 5h6M4 7h6M4 9h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Modified
          </span>
          <div class="panel__actions">
            <button class="icon-btn" id="btn-paste-modified" title="Paste from clipboard" aria-label="Paste modified text">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="4" y="2" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M4 4H3a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-upload-modified" title="Upload file" aria-label="Upload modified file">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 9V2M4 5l3-3 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 9v2a1 1 0 001 1h8a1 1 0 001-1V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="panel__body">
          <textarea
            class="editor"
            id="text-modified"
            placeholder="Paste modified text here…"
            spellcheck="false"
            autocomplete="off"
            aria-label="Modified text"
          ></textarea>
        </div>
        <div class="panel__footer">
          <span class="meta" id="modified-meta">0 lines · 0 chars</span>
        </div>
      </div>
    </div>

    <!-- Diff Result -->
    <div class="diff-result" id="diff-result" hidden>
      <div class="diff-header">
        <div class="diff-header__left">
          <h2 class="diff-header__title">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <rect x="1" y="1" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
              <path d="M5 9h8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
              <path d="M9 5v8" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Comparison Result
          </h2>
          <div class="diff-stats" id="diff-stats">
            <span class="diff-stat diff-stat--added" id="stat-added">
              <span class="diff-stat__dot diff-stat__dot--added"></span>
              0 added
            </span>
            <span class="diff-stat diff-stat--removed" id="stat-removed">
              <span class="diff-stat__dot diff-stat__dot--removed"></span>
              0 removed
            </span>
            <span class="diff-stat diff-stat--unchanged" id="stat-unchanged">
              <span class="diff-stat__dot diff-stat__dot--unchanged"></span>
              0 unchanged
            </span>
          </div>
        </div>
        <div class="diff-header__right">
          <div class="view-toggle" role="radiogroup" aria-label="Diff view mode">
            <button class="view-btn active" id="btn-view-split" role="radio" aria-checked="true" title="Split view">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/>
                <line x1="7" y1="1" x2="7" y2="13" stroke="currentColor" stroke-width="1.3"/>
              </svg>
              Split
            </button>
            <button class="view-btn" id="btn-view-unified" role="radio" aria-checked="false" title="Unified view">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/>
                <line x1="1" y1="5" x2="13" y2="5" stroke="currentColor" stroke-width="1.3"/>
                <line x1="1" y1="9" x2="13" y2="9" stroke="currentColor" stroke-width="1.3"/>
              </svg>
              Unified
            </button>
          </div>
          <button class="icon-btn" id="btn-copy-diff" title="Copy diff as text" aria-label="Copy diff">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="M2 10V3a1 1 0 011-1h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Split View -->
      <div class="diff-panels" id="diff-split-view">
        <div class="diff-panel diff-panel--original">
          <div class="diff-panel__header">Original</div>
          <div class="diff-panel__body" id="diff-original-body"></div>
        </div>
        <div class="diff-panel diff-panel--modified">
          <div class="diff-panel__header">Modified</div>
          <div class="diff-panel__body" id="diff-modified-body"></div>
        </div>
      </div>

      <!-- Unified View -->
      <div class="diff-unified" id="diff-unified-view" hidden>
        <div class="diff-panel__body" id="diff-unified-body"></div>
      </div>
    </div>

    <!-- Stats row -->
    <div class="stats-row" id="stats-row" hidden>
      <div class="stat-card">
        <span class="stat-card__value" id="stat-similarity">—</span>
        <span class="stat-card__label">Similarity</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="stat-total-lines">—</span>
        <span class="stat-card__label">Total Lines</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="stat-changes">—</span>
        <span class="stat-card__label">Changes</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="stat-diff-mode">—</span>
        <span class="stat-card__label">Diff Mode</span>
      </div>
    </div>

  </main>

  <footer class="footer">
    <p>Built with ❤️ &nbsp;·&nbsp; No data is ever stored or sent anywhere</p>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Hidden file inputs -->
  <input type="file" id="file-original" accept=".txt,.json,.xml,.html,.css,.js,.ts,.py,.java,.go,.rs,.md,.csv,.log,.yml,.yaml,.toml,.cfg,.ini,.sh,.bat,.sql" hidden />
  <input type="file" id="file-modified" accept=".txt,.json,.xml,.html,.css,.js,.ts,.py,.java,.go,.rs,.md,.csv,.log,.yml,.yaml,.toml,.cfg,.ini,.sh,.bat,.sql" hidden />

  <script src="app.js"></script>
</body>
</html>
